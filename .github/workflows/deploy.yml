name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ~/crypto_backtest

            echo "=== Pulling latest code ==="
            git fetch --tags
            git checkout v0.1.2

            echo "=== Installing dependencies ==="
            source .venv/bin/activate
            pip install -e . -q

            echo "=== Installing web service ==="
            cp deploy/trading-web.service ~/.config/systemd/user/trading-web.service
            systemctl --user daemon-reload
            systemctl --user enable trading-web

            echo "=== Restarting services ==="
            systemctl --user restart trading-consecutive
            systemctl --user restart trading-web

            echo "=== Service status ==="
            systemctl --user status trading-consecutive --no-pager -l
            systemctl --user status trading-web --no-pager -l
